name: Update predict.fun stats

on:
  schedule:
    - cron: '0 */1 * * *'  # Every hour
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch predict.fun stats
        run: |
          curl -s -X POST https://graphql.predict.fun/graphql \
            -H 'Content-Type: application/json' \
            -d '{"query":"{ statistics { totalVolumeUsd totalAccountsCount totalBetsToDateCount volume30dUsd } }"}' \
            -o stats_graphql.json
          cat stats_graphql.json

      - name: Fetch on-chain TVL from BSC
        continue-on-error: true
        run: |
          RPC="https://bsc-dataseed.binance.org/"

          # Token addresses
          USDT="0x55d398326f99059fF775485246999027B3197955"
          VUSDT="0xfD5840Cd36d94D7229439859C0112a4185BC0255"

          # Regular TVL contracts (hold USDT, 18 decimals)
          REGULAR_1="66239b70133773A72A0D589E5564E88a50Cd39e7"
          REGULAR_2="22DA1810B194ca018378464a58f6Ac2B10C9d244"

          # Earning Yield contracts (hold vUSDT, 8 decimals)
          YIELD_1="Cfb9beF5F7B748aC72311F057f3a888BC73334D9"
          YIELD_2="9400F8Ad57e9e0F352345935d6D3175975eb1d9F"

          # balanceOf(address) = 0x70a08231
          # exchangeRateStored() = 0x182df0f5

          # USDT balance of Regular contract 1
          USDT_R1=$(curl -s -X POST "$RPC" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"eth_call","params":[{"to":"'"$USDT"'","data":"0x70a08231000000000000000000000000'"$REGULAR_1"'"},"latest"],"id":1}' \
            | python3 -c "import sys,json; print(int(json.load(sys.stdin)['result'],16))")
          echo "USDT in Regular_1: $USDT_R1"

          # USDT balance of Regular contract 2
          USDT_R2=$(curl -s -X POST "$RPC" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"eth_call","params":[{"to":"'"$USDT"'","data":"0x70a08231000000000000000000000000'"$REGULAR_2"'"},"latest"],"id":2}' \
            | python3 -c "import sys,json; print(int(json.load(sys.stdin)['result'],16))")
          echo "USDT in Regular_2: $USDT_R2"

          # vUSDT balance of Yield contract 1
          VUSDT_Y1=$(curl -s -X POST "$RPC" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"eth_call","params":[{"to":"'"$VUSDT"'","data":"0x70a08231000000000000000000000000'"$YIELD_1"'"},"latest"],"id":3}' \
            | python3 -c "import sys,json; print(int(json.load(sys.stdin)['result'],16))")
          echo "vUSDT in Yield_1: $VUSDT_Y1"

          # vUSDT balance of Yield contract 2
          VUSDT_Y2=$(curl -s -X POST "$RPC" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"eth_call","params":[{"to":"'"$VUSDT"'","data":"0x70a08231000000000000000000000000'"$YIELD_2"'"},"latest"],"id":4}' \
            | python3 -c "import sys,json; print(int(json.load(sys.stdin)['result'],16))")
          echo "vUSDT in Yield_2: $VUSDT_Y2"

          # vUSDT exchange rate (to convert vUSDT -> underlying USDT)
          EXCHANGE_RATE=$(curl -s -X POST "$RPC" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"eth_call","params":[{"to":"'"$VUSDT"'","data":"0x182df0f5"},"latest"],"id":5}' \
            | python3 -c "import sys,json; print(int(json.load(sys.stdin)['result'],16))")
          echo "vUSDT exchange rate: $EXCHANGE_RATE"

          # Calculate TVL (unquoted heredoc so shell vars expand)
          python3 << PYEOF > tvl_onchain.json
          import json

          usdt_r1 = $USDT_R1
          usdt_r2 = $USDT_R2
          vusdt_y1 = $VUSDT_Y1
          vusdt_y2 = $VUSDT_Y2
          exchange_rate = $EXCHANGE_RATE

          # Regular TVL: USDT has 18 decimals on BSC
          regular_tvl = (usdt_r1 + usdt_r2) / 1e18

          # Earning Yield TVL: vUSDT has 8 decimals
          # exchangeRate mantissa = 10^(18 + underlyingDecimals - 8) = 10^28
          # underlying = vToken_raw * exchangeRate / 1e18 (raw USDT with 18 decimals)
          # USD = underlying / 1e18
          yield_tvl = ((vusdt_y1 + vusdt_y2) * exchange_rate) / 1e36

          total_tvl = regular_tvl + yield_tvl

          result = {
              "regularTvlUsd": round(regular_tvl, 2),
              "earningYieldTvlUsd": round(yield_tvl, 2),
              "totalValueLockedUsd": round(total_tvl, 2)
          }
          print(json.dumps(result))
          print(f"Regular: \${regular_tvl:,.2f} | Yield: \${yield_tvl:,.2f} | Total: \${total_tvl:,.2f}", file=__import__('sys').stderr)
          PYEOF
          echo "On-chain TVL:"
          cat tvl_onchain.json

      - name: Fetch DefiLlama TVL
        run: |
          DEFILLAMA_TVL=$(curl -s "https://api.llama.fi/tvl/predict-fun")
          echo "DefiLlama TVL: $DEFILLAMA_TVL"
          echo "$DEFILLAMA_TVL" > tvl_defillama.txt

      - name: Merge stats into stats.json
        run: |
          python3 << 'PYEOF'
          import json, os

          with open('stats_graphql.json') as f:
              stats = json.load(f)

          # Try on-chain TVL first
          onchain_tvl = None
          if os.path.exists('tvl_onchain.json'):
              try:
                  with open('tvl_onchain.json') as f:
                      tvl = json.load(f)
                  if tvl.get('totalValueLockedUsd', 0) > 1_000_000:
                      onchain_tvl = tvl
                      print(f"Using on-chain TVL: ${tvl['totalValueLockedUsd']:,.2f}")
                  else:
                      print(f"On-chain TVL too low (${tvl.get('totalValueLockedUsd', 0):,.2f}), using DefiLlama")
              except Exception as e:
                  print(f"Failed to read on-chain TVL: {e}")

          # DefiLlama TVL as fallback
          defillama_tvl = None
          if os.path.exists('tvl_defillama.txt'):
              try:
                  with open('tvl_defillama.txt') as f:
                      defillama_tvl = float(f.read().strip())
                  print(f"DefiLlama TVL: ${defillama_tvl:,.2f}")
              except Exception as e:
                  print(f"Failed to read DefiLlama TVL: {e}")

          # Use on-chain if valid (>$1M), otherwise DefiLlama
          if 'data' in stats and 'statistics' in stats['data']:
              if onchain_tvl:
                  stats['data']['statistics']['totalValueLockedUsd'] = onchain_tvl['totalValueLockedUsd']
                  stats['data']['statistics']['regularTvlUsd'] = onchain_tvl['regularTvlUsd']
                  stats['data']['statistics']['earningYieldTvlUsd'] = onchain_tvl['earningYieldTvlUsd']
                  stats['data']['statistics']['tvlSource'] = 'onchain'
              elif defillama_tvl and defillama_tvl > 0:
                  stats['data']['statistics']['totalValueLockedUsd'] = round(defillama_tvl, 2)
                  stats['data']['statistics']['tvlSource'] = 'defillama'

          with open('stats.json', 'w') as f:
              json.dump(stats, f)

          print("Final stats.json:")
          print(json.dumps(stats, indent=2))
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --staged --quiet || git commit -m "Update stats.json [skip ci]"
          git push
